name: flutter_pda_scanner_aida
description: "Flutter plugin for AIDA PDA handheld scanner devices. Android-only."
repository: https://github.com/venhdev/flutter_pda_scanner_aida
version: 1.0.1
topics:
  - barcode-scanner
  - scanner
  - pda
  - aida
  - handheld

environment:
  sdk: ^3.12.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.rirong.flutter_pda_scanner_aida
        pluginClass: PdaScannerPlugin
